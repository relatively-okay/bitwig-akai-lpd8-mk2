<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">bitwig-akai-lpd8-mk2</title>
  <desc id="d">Knobs that follow the selected device, plus a clip launcher, for the Akai LPD8 mk2 in Bitwig Studio. Illustration of an eight-pad, eight-knob controller with pads lit amber, green and red.</desc>
  <defs>
    <!-- Banner background -->
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1018"/>
      <stop offset="0.55" stop-color="#111624"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <radialGradient id="haloAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffae1a" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffae1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ee87a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2ee87a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f6bff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="400" fill="url(#gridFade)"/></mask>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb224" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ffb224" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#37d67a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#37d67a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="0.3" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Device materials -->
    <linearGradient id="bodyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303642"/>
      <stop offset="0.08" stop-color="#282d38"/>
      <stop offset="1" stop-color="#1b1f28"/>
    </linearGradient>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1218"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="bodySheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="knobBody" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#444b58"/>
      <stop offset="0.7" stop-color="#262b34"/>
      <stop offset="1" stop-color="#15181f"/>
    </radialGradient>
    <radialGradient id="knobCap" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2f3540"/>
      <stop offset="1" stop-color="#1b1f27"/>
    </radialGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a414d"/>
      <stop offset="1" stop-color="#242933"/>
    </linearGradient>

    <!-- Pad fills -->
    <linearGradient id="padAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset="0.5" stop-color="#ffb224"/>
      <stop offset="1" stop-color="#f08a00"/>
    </linearGradient>
    <linearGradient id="padGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dffc6"/>
      <stop offset="0.5" stop-color="#37d67a"/>
      <stop offset="1" stop-color="#17a85a"/>
    </linearGradient>
    <linearGradient id="padGreenPulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ffe9"/>
      <stop offset="0.45" stop-color="#6cf0a3"/>
      <stop offset="1" stop-color="#28c46c"/>
    </linearGradient>
    <linearGradient id="padRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a8f"/>
      <stop offset="0.5" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#d61f2c"/>
    </linearGradient>
    <linearGradient id="padOff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d323d"/>
      <stop offset="1" stop-color="#1e222b"/>
    </linearGradient>
    <linearGradient id="padGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="bloomSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-60%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="knobShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)" font-family="Inter, 'Noto Sans', 'DejaVu Sans', system-ui, sans-serif">
    <!-- ===== Background ===== -->
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)" mask="url(#gridMask)"/>
    <ellipse cx="180" cy="40" rx="420" ry="260" fill="url(#haloBlue)"/>
    <ellipse cx="860" cy="230" rx="420" ry="300" fill="url(#haloAmber)"/>
    <ellipse cx="1010" cy="170" rx="330" ry="240" fill="url(#haloGreen)"/>
    <polyline fill="none" stroke="url(#wave)" stroke-width="1.5" stroke-linejoin="round"
      points="0,359.8 8,362.1 16,356.9 24,352.8 32,356.8 40,361.6 48,360.7 56,360.0 64,362.5 72,360.1 80,350.1 88,342.9 96,343.6 104,344.5 112,342.3 120,344.0 128,349.8 136,349.9 144,343.7 152,341.6 160,345.9 168,348.6 176,349.5 184,356.0 192,364.9 200,365.9 208,360.4 216,358.3 224,359.2 232,356.2 240,352.5 248,355.8 256,360.6 264,357.4 272,349.8 280,346.7 288,344.9 296,339.2 304,336.0 312,341.9 320,349.2 328,349.6 336,348.3 344,351.1 352,352.5 360,348.7 368,348.4 376,356.4 384,363.6 392,363.7 400,363.2 408,365.1 416,362.0 424,353.0 432,348.5 440,351.6 448,353.2 456,350.0 464,349.3 472,351.1 480,347.0 488,338.5 496,336.5 504,341.6 512,345.0 520,346.2 528,352.1 536,359.2 544,358.2 552,352.9 560,353.3 568,357.7 576,358.4 584,358.2 592,363.3 600,367.4 608,362.1 616,353.4 624,350.3 632,349.0 640,344.2 648,341.9 656,347.1 664,351.2 672,347.2 680,342.4 688,343.3 696,344.0 704,341.5 712,343.9 720,353.9 728,361.1 736,360.4 744,359.5 752,361.7 760,360.0 768,354.2 776,354.1 784,360.3 792,362.4 800,358.1 808,355.4 816,354.5 824,348.0 832,339.1 840,338.1 848,343.6 856,345.7 864,344.8 872,347.8 880,351.5 888,348.2 896,343.4 904,346.6 912,354.2 920,357.3 928,359.1 936,364.8 944,368.0 952,362.1 960,354.8 968,354.4 976,355.7 984,352.9 992,351.5 1000,355.3 1008,355.6 1016,347.6 1024,340.4 1032,340.3 1040,340.8 1048,338.9 1056,342.0 1064,351.0 1072,355.5 1080,352.4 1088,350.8 1096,354.0 1104,354.7 1112,352.9 1120,357.0 1128,365.5 1136,367.5 1144,362.4 1152,359.0 1160,357.8 1168,351.9 1176,344.8 1184,345.8 1192,351.1 1200,350.7 1208,346.3 1216,345.6 1224,345.8 1232,340.7 1240,336.6 1248,341.9 1256,350.6 1264,353.7 1272,355.0 1280,359.8"/>
    <rect width="1280" height="400" fill="url(#vignette)"/>

    <!-- ===== Copy ===== -->
    <g>
      <rect x="60" y="104" width="22" height="3" rx="1.5" fill="#ffb224"/>
      <text x="92" y="110" font-size="12.5" font-weight="600" letter-spacing="2.6" fill="#8d97ab">BITWIG STUDIO CONTROLLER SCRIPT</text>
      <text x="58" y="172" font-size="50" font-weight="800" letter-spacing="-1.2" fill="#f4f6fa">bitwig-akai-lpd8-mk2</text>
      <text x="60" y="216" font-size="19" font-weight="400" fill="#aeb7c8">Knobs that follow your device + clip launcher</text>
      <text x="60" y="244" font-size="19" font-weight="400" fill="#aeb7c8">for the Akai LPD8 mk2 in Bitwig Studio</text>

      <line x1="60" y1="282" x2="560" y2="282" stroke="#ffffff" stroke-opacity="0.09"/>

      <!-- Pad colour legend -->
      <g font-size="12" font-weight="600" letter-spacing="1.6" fill="#c5ccda">
        <g transform="translate(66 311)">
          <circle r="7" fill="#ffb224" filter="url(#dotGlow)" opacity="0.7"/>
          <circle r="5" fill="#ffb224"/>
          <text x="16" y="4.5">CLIP</text>
        </g>
        <g transform="translate(150 311)">
          <circle r="7" fill="#37d67a" filter="url(#dotGlow)" opacity="0.7"/>
          <circle r="5" fill="#37d67a"/>
          <text x="16" y="4.5">PLAYING</text>
        </g>
        <g transform="translate(262 311)">
          <circle r="8" fill="none" stroke="#6cf0a3" stroke-width="1.2" opacity="0.8"/>
          <circle r="5" fill="#6cf0a3"/>
          <text x="16" y="4.5">QUEUED</text>
        </g>
        <g transform="translate(366 311)">
          <circle r="7" fill="#ff4d4d" filter="url(#dotGlow)" opacity="0.7"/>
          <circle r="5" fill="#ff4d4d"/>
          <text x="16" y="4.5">STOP</text>
        </g>
        <g transform="translate(446 311)">
          <circle r="5" fill="#2d323d" stroke="#454c5a" stroke-width="1"/>
          <text x="16" y="4.5">EMPTY</text>
        </g>
      </g>
    </g>

    <!-- ===== Controller illustration ===== -->
    <g transform="translate(650 75)">
      <!-- floor shadow -->
      <ellipse cx="290" cy="258" rx="300" ry="26" fill="#000" opacity="0.65" filter="url(#shadow)"/>

      <!-- body thickness (front edge) -->
      <rect x="0" y="8" width="580" height="250" rx="18" fill="url(#bodyEdge)"/>
      <!-- top face -->
      <rect x="0" y="0" width="580" height="250" rx="18" fill="url(#bodyTop)"/>
      <rect x="0" y="0" width="580" height="250" rx="18" fill="url(#bodySheen)"/>
      <rect x="0.5" y="0.5" width="579" height="249" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
      <!-- subtle recessed control plate -->
      <rect x="62" y="44" width="296" height="162" rx="12" fill="#000" opacity="0.22"/>

      <!-- left function buttons -->
      <g>
        <rect x="20" y="66" width="30" height="16" rx="4" fill="url(#btn)" stroke="#0d1016" stroke-width="1"/>
        <rect x="20" y="92" width="30" height="16" rx="4" fill="url(#btn)" stroke="#0d1016" stroke-width="1"/>
        <rect x="20" y="118" width="30" height="16" rx="4" fill="url(#btn)" stroke="#0d1016" stroke-width="1"/>
        <rect x="20" y="144" width="30" height="16" rx="4" fill="url(#btn)" stroke="#0d1016" stroke-width="1"/>
        <!-- status LED -->
        <circle cx="35" cy="178" r="5" fill="#37d67a" opacity="0.6" filter="url(#dotGlow)"/>
        <circle cx="35" cy="178" r="2.6" fill="#8dffbf"/>
        <!-- tiny USB notch on top edge -->
        <rect x="266" y="-1" width="48" height="6" rx="2" fill="#0a0c11"/>
      </g>

      <!-- ===== Pads: bloom layer ===== -->
      <g>
        <rect x="72" y="59" width="60" height="60" rx="10" fill="#ffae1a" opacity="0.4" filter="url(#bloomSoft)"/>
        <rect x="144" y="59" width="60" height="60" rx="10" fill="#2ee87a" opacity="0.4" filter="url(#bloomSoft)"/>
        <rect x="216" y="59" width="60" height="60" rx="10" fill="#ffae1a" opacity="0.4" filter="url(#bloomSoft)"/>
        <rect x="144" y="131" width="60" height="60" rx="10" fill="#ffae1a" opacity="0.4" filter="url(#bloomSoft)"/>
        <rect x="288" y="131" width="60" height="60" rx="10" fill="#ff3b3b" opacity="0.4" filter="url(#bloomSoft)"/>
        <rect x="72" y="59" width="60" height="60" rx="10" fill="#ffae1a" opacity="0.9" filter="url(#bloom)"/>
        <rect x="144" y="59" width="60" height="60" rx="10" fill="#2ee87a" opacity="0.9" filter="url(#bloom)"/>
        <rect x="216" y="59" width="60" height="60" rx="10" fill="#ffae1a" opacity="0.9" filter="url(#bloom)"/>
        <rect x="72" y="131" width="60" height="60" rx="10" fill="#6cf0a3" opacity="0.95" filter="url(#bloom)"/>
        <rect x="72" y="131" width="60" height="60" rx="10" fill="#6cf0a3" opacity="0.5" filter="url(#bloomSoft)"/>
        <rect x="144" y="131" width="60" height="60" rx="10" fill="#ffae1a" opacity="0.9" filter="url(#bloom)"/>
        <rect x="288" y="131" width="60" height="60" rx="10" fill="#ff3b3b" opacity="0.9" filter="url(#bloom)"/>
      </g>

      <!-- ===== Pads: bezels ===== -->
      <g fill="#0e1117">
        <rect x="70" y="57" width="64" height="64" rx="11"/>
        <rect x="142" y="57" width="64" height="64" rx="11"/>
        <rect x="214" y="57" width="64" height="64" rx="11"/>
        <rect x="286" y="57" width="64" height="64" rx="11"/>
        <rect x="70" y="129" width="64" height="64" rx="11"/>
        <rect x="142" y="129" width="64" height="64" rx="11"/>
        <rect x="214" y="129" width="64" height="64" rx="11"/>
        <rect x="286" y="129" width="64" height="64" rx="11"/>
      </g>

      <!-- ===== Pads: faces ===== -->
      <!-- row 1 -->
      <g>
        <rect x="72" y="59" width="60" height="60" rx="9" fill="url(#padAmber)" stroke="#ffe3a0" stroke-opacity="0.55"/>
        <rect x="76" y="62" width="52" height="26" rx="7" fill="url(#padGloss)"/>
      </g>
      <g>
        <rect x="144" y="59" width="60" height="60" rx="9" fill="url(#padGreen)" stroke="#c4ffdc" stroke-opacity="0.55"/>
        <rect x="148" y="62" width="52" height="26" rx="7" fill="url(#padGloss)"/>
      </g>
      <g>
        <rect x="216" y="59" width="60" height="60" rx="9" fill="url(#padAmber)" stroke="#ffe3a0" stroke-opacity="0.55"/>
        <rect x="220" y="62" width="52" height="26" rx="7" fill="url(#padGloss)"/>
      </g>
      <g>
        <rect x="288" y="59" width="60" height="60" rx="9" fill="url(#padOff)" stroke="#3b4250" stroke-opacity="0.9"/>
        <rect x="292" y="62" width="52" height="26" rx="7" fill="url(#padGloss)" opacity="0.25"/>
      </g>
      <!-- row 2 -->
      <g>
        <!-- queued: pulsing rings -->
        <rect x="66" y="125" width="72" height="72" rx="13" fill="none" stroke="#9dffc6" stroke-opacity="0.55" stroke-width="1.5"/>
        <rect x="61" y="120" width="82" height="82" rx="16" fill="none" stroke="#9dffc6" stroke-opacity="0.22" stroke-width="1.5"/>
        <rect x="72" y="131" width="60" height="60" rx="9" fill="url(#padGreenPulse)" stroke="#eafff3" stroke-opacity="0.8"/>
        <rect x="76" y="134" width="52" height="26" rx="7" fill="url(#padGloss)"/>
      </g>
      <g>
        <rect x="144" y="131" width="60" height="60" rx="9" fill="url(#padAmber)" stroke="#ffe3a0" stroke-opacity="0.55"/>
        <rect x="148" y="134" width="52" height="26" rx="7" fill="url(#padGloss)"/>
      </g>
      <g>
        <rect x="216" y="131" width="60" height="60" rx="9" fill="url(#padOff)" stroke="#3b4250" stroke-opacity="0.9"/>
        <rect x="220" y="134" width="52" height="26" rx="7" fill="url(#padGloss)" opacity="0.25"/>
      </g>
      <g>
        <rect x="288" y="131" width="60" height="60" rx="9" fill="url(#padRed)" stroke="#ffc9c2" stroke-opacity="0.55"/>
        <rect x="292" y="134" width="52" height="26" rx="7" fill="url(#padGloss)"/>
        <!-- stop glyph -->
        <rect x="309" y="152" width="18" height="18" rx="2" fill="#5a0b12" opacity="0.75"/>
      </g>

      <!-- ===== Knobs ===== -->
      <g>
        <!-- tick rings -->
        <g fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1.2" stroke-dasharray="1.5 5.2">
          <circle cx="390" cy="89" r="24"/><circle cx="442" cy="89" r="24"/><circle cx="494" cy="89" r="24"/><circle cx="546" cy="89" r="24"/>
          <circle cx="390" cy="161" r="24"/><circle cx="442" cy="161" r="24"/><circle cx="494" cy="161" r="24"/><circle cx="546" cy="161" r="24"/>
        </g>
        <!-- shadows -->
        <g fill="#000" opacity="0.6" filter="url(#knobShadow)">
          <circle cx="390" cy="92" r="19"/><circle cx="442" cy="92" r="19"/><circle cx="494" cy="92" r="19"/><circle cx="546" cy="92" r="19"/>
          <circle cx="390" cy="164" r="19"/><circle cx="442" cy="164" r="19"/><circle cx="494" cy="164" r="19"/><circle cx="546" cy="164" r="19"/>
        </g>
        <!-- bodies -->
        <g stroke="#4a5262" stroke-width="0.8">
          <circle cx="390" cy="89" r="18" fill="url(#knobBody)"/><circle cx="442" cy="89" r="18" fill="url(#knobBody)"/>
          <circle cx="494" cy="89" r="18" fill="url(#knobBody)"/><circle cx="546" cy="89" r="18" fill="url(#knobBody)"/>
          <circle cx="390" cy="161" r="18" fill="url(#knobBody)"/><circle cx="442" cy="161" r="18" fill="url(#knobBody)"/>
          <circle cx="494" cy="161" r="18" fill="url(#knobBody)"/><circle cx="546" cy="161" r="18" fill="url(#knobBody)"/>
        </g>
        <!-- caps -->
        <g fill="url(#knobCap)" stroke="#0e1117" stroke-width="0.8">
          <circle cx="390" cy="89" r="12"/><circle cx="442" cy="89" r="12"/><circle cx="494" cy="89" r="12"/><circle cx="546" cy="89" r="12"/>
          <circle cx="390" cy="161" r="12"/><circle cx="442" cy="161" r="12"/><circle cx="494" cy="161" r="12"/><circle cx="546" cy="161" r="12"/>
        </g>
        <!-- pointers (each rotated to a different value) -->
        <g stroke="#eef2f8" stroke-width="2.4" stroke-linecap="round">
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(390 89) rotate(-110)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(442 89) rotate(-40)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(494 89) rotate(25)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(546 89) rotate(90)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(390 161) rotate(-70)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(442 161) rotate(140)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(494 161) rotate(-20)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(546 161) rotate(60)"/>
        </g>
        <!-- bank indicator: 8 tiny dots, one lit -->
        <g transform="translate(390 212)">
          <circle cx="0" cy="0" r="2.2" fill="#2a2f3a"/>
          <circle cx="22" cy="0" r="2.2" fill="#2a2f3a"/>
          <circle cx="44" cy="0" r="3.4" fill="#ffb224" opacity="0.6" filter="url(#dotGlow)"/>
          <circle cx="44" cy="0" r="2.2" fill="#ffd166"/>
          <circle cx="66" cy="0" r="2.2" fill="#2a2f3a"/>
          <circle cx="88" cy="0" r="2.2" fill="#2a2f3a"/>
          <circle cx="110" cy="0" r="2.2" fill="#2a2f3a"/>
          <circle cx="132" cy="0" r="2.2" fill="#2a2f3a"/>
          <circle cx="154" cy="0" r="2.2" fill="#2a2f3a"/>
        </g>
      </g>
    </g>
  </g>
</svg>
