<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">bitwig-akai-lpd8-mk2</title>
  <desc id="d">Akai LPD8 mk2 controller script for Bitwig Studio. Illustration of an eight-pad, eight-knob controller with a few pads lit amber, green and blue.</desc>
  <defs>
    <!-- Banner background -->
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1119"/>
      <stop offset="0.55" stop-color="#121725"/>
      <stop offset="1" stop-color="#0b0e15"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffae1a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffae1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Device materials -->
    <linearGradient id="bodyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303642"/>
      <stop offset="0.08" stop-color="#282d38"/>
      <stop offset="1" stop-color="#1b1f28"/>
    </linearGradient>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1218"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="bodySheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="knobBody" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#444b58"/>
      <stop offset="0.7" stop-color="#262b34"/>
      <stop offset="1" stop-color="#15181f"/>
    </radialGradient>
    <radialGradient id="knobCap" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2f3540"/>
      <stop offset="1" stop-color="#1b1f27"/>
    </radialGradient>

    <!-- Pad fills -->
    <linearGradient id="padAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd467"/>
      <stop offset="0.5" stop-color="#ffb224"/>
      <stop offset="1" stop-color="#f08a00"/>
    </linearGradient>
    <linearGradient id="padGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ef7b8"/>
      <stop offset="0.5" stop-color="#37d67a"/>
      <stop offset="1" stop-color="#17a85a"/>
    </linearGradient>
    <linearGradient id="padBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ec8ff"/>
      <stop offset="0.5" stop-color="#4d8dff"/>
      <stop offset="1" stop-color="#2b63d6"/>
    </linearGradient>
    <linearGradient id="padOff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d323d"/>
      <stop offset="1" stop-color="#1e222b"/>
    </linearGradient>
    <linearGradient id="padGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-30%" y="-60%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="knobShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)" font-family="Inter, 'Noto Sans', 'DejaVu Sans', system-ui, sans-serif">
    <!-- ===== Background ===== -->
    <rect width="1280" height="400" fill="url(#bg)"/>
    <ellipse cx="930" cy="210" rx="460" ry="300" fill="url(#halo)"/>

    <!-- ===== Copy ===== -->
    <text x="68" y="190" font-size="50" font-weight="800" letter-spacing="-1.2" fill="#f4f6fa">bitwig-akai-lpd8-mk2</text>
    <text x="70" y="232" font-size="20" font-weight="400" fill="#a9b2c3">Akai LPD8 mk2 controller script for Bitwig Studio</text>

    <!-- ===== Controller illustration ===== -->
    <g transform="translate(660 75)">
      <!-- floor shadow -->
      <ellipse cx="286" cy="258" rx="290" ry="26" fill="#000" opacity="0.6" filter="url(#shadow)"/>

      <!-- body thickness (front edge) -->
      <rect x="0" y="8" width="572" height="250" rx="18" fill="url(#bodyEdge)"/>
      <!-- top face -->
      <rect x="0" y="0" width="572" height="250" rx="18" fill="url(#bodyTop)"/>
      <rect x="0" y="0" width="572" height="250" rx="18" fill="url(#bodySheen)"/>
      <rect x="0.5" y="0.5" width="571" height="249" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- ===== Pads: soft glow ===== -->
      <g opacity="0.55" filter="url(#glow)">
        <rect x="36" y="59" width="60" height="60" rx="10" fill="#ffae1a"/>
        <rect x="180" y="59" width="60" height="60" rx="10" fill="#2ee87a"/>
        <rect x="108" y="131" width="60" height="60" rx="10" fill="#ffae1a"/>
        <rect x="252" y="131" width="60" height="60" rx="10" fill="#4d8dff"/>
      </g>

      <!-- ===== Pads: bezels ===== -->
      <g fill="#0e1117">
        <rect x="34" y="57" width="64" height="64" rx="11"/>
        <rect x="106" y="57" width="64" height="64" rx="11"/>
        <rect x="178" y="57" width="64" height="64" rx="11"/>
        <rect x="250" y="57" width="64" height="64" rx="11"/>
        <rect x="34" y="129" width="64" height="64" rx="11"/>
        <rect x="106" y="129" width="64" height="64" rx="11"/>
        <rect x="178" y="129" width="64" height="64" rx="11"/>
        <rect x="250" y="129" width="64" height="64" rx="11"/>
      </g>

      <!-- ===== Pads: faces ===== -->
      <!-- row 1: amber, off, green, off -->
      <rect x="36" y="59" width="60" height="60" rx="9" fill="url(#padAmber)" stroke="#ffe3a0" stroke-opacity="0.5"/>
      <rect x="40" y="62" width="52" height="26" rx="7" fill="url(#padGloss)"/>
      <rect x="108" y="59" width="60" height="60" rx="9" fill="url(#padOff)" stroke="#3b4250" stroke-opacity="0.9"/>
      <rect x="180" y="59" width="60" height="60" rx="9" fill="url(#padGreen)" stroke="#c4ffdc" stroke-opacity="0.5"/>
      <rect x="184" y="62" width="52" height="26" rx="7" fill="url(#padGloss)"/>
      <rect x="252" y="59" width="60" height="60" rx="9" fill="url(#padOff)" stroke="#3b4250" stroke-opacity="0.9"/>
      <!-- row 2: off, amber, off, blue -->
      <rect x="36" y="131" width="60" height="60" rx="9" fill="url(#padOff)" stroke="#3b4250" stroke-opacity="0.9"/>
      <rect x="108" y="131" width="60" height="60" rx="9" fill="url(#padAmber)" stroke="#ffe3a0" stroke-opacity="0.5"/>
      <rect x="112" y="134" width="52" height="26" rx="7" fill="url(#padGloss)"/>
      <rect x="180" y="131" width="60" height="60" rx="9" fill="url(#padOff)" stroke="#3b4250" stroke-opacity="0.9"/>
      <rect x="252" y="131" width="60" height="60" rx="9" fill="url(#padBlue)" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <rect x="256" y="134" width="52" height="26" rx="7" fill="url(#padGloss)"/>

      <!-- ===== Knobs ===== -->
      <g>
        <g fill="#000" opacity="0.55" filter="url(#knobShadow)">
          <circle cx="376" cy="92" r="19"/><circle cx="428" cy="92" r="19"/><circle cx="480" cy="92" r="19"/><circle cx="532" cy="92" r="19"/>
          <circle cx="376" cy="164" r="19"/><circle cx="428" cy="164" r="19"/><circle cx="480" cy="164" r="19"/><circle cx="532" cy="164" r="19"/>
        </g>
        <g fill="url(#knobBody)" stroke="#4a5262" stroke-width="0.8">
          <circle cx="376" cy="89" r="18"/><circle cx="428" cy="89" r="18"/><circle cx="480" cy="89" r="18"/><circle cx="532" cy="89" r="18"/>
          <circle cx="376" cy="161" r="18"/><circle cx="428" cy="161" r="18"/><circle cx="480" cy="161" r="18"/><circle cx="532" cy="161" r="18"/>
        </g>
        <g fill="url(#knobCap)" stroke="#0e1117" stroke-width="0.8">
          <circle cx="376" cy="89" r="12"/><circle cx="428" cy="89" r="12"/><circle cx="480" cy="89" r="12"/><circle cx="532" cy="89" r="12"/>
          <circle cx="376" cy="161" r="12"/><circle cx="428" cy="161" r="12"/><circle cx="480" cy="161" r="12"/><circle cx="532" cy="161" r="12"/>
        </g>
        <!-- pointers, each at a different value -->
        <g stroke="#eef2f8" stroke-width="2.4" stroke-linecap="round">
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(376 89) rotate(-110)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(428 89) rotate(-40)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(480 89) rotate(25)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(532 89) rotate(90)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(376 161) rotate(-70)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(428 161) rotate(140)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(480 161) rotate(-20)"/>
          <line x1="0" y1="-6" x2="0" y2="-16" transform="translate(532 161) rotate(60)"/>
        </g>
      </g>
    </g>
  </g>
</svg>
